<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marco Tulio | About Me</title>
    <meta
      name="description"
      content="About Marco Tulio: projects, papers, posts, and social links."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="container">
        <h1 id="name"></h1>
        <p id="tagline" class="tagline"></p>
      </div>
    </header>

    <main class="container">
      <section aria-labelledby="about-title">
        <h2 id="about-title">About Me</h2>
        <p id="about"></p>
      </section>

      <section aria-labelledby="projects-title">
        <h2 id="projects-title">Projects</h2>
        <div id="projects" class="grid"></div>
      </section>

      <section aria-labelledby="papers-title">
        <h2 id="papers-title">Papers & Whitepapers</h2>
        <div id="papers" class="grid"></div>
      </section>

      <section aria-labelledby="posts-title">
        <h2 id="posts-title">Posts</h2>
        <div id="post-filters" class="filters"></div>
        <div id="posts" class="grid"></div>
      </section>

      <section aria-labelledby="socials-title">
        <h2 id="socials-title">Socials</h2>
        <ul id="socials" class="socials"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
